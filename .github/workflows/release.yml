name: Release

# Builds a download for each system and proves each one works on its own system before it is offered.
# Run by hand (Actions, Release, Run workflow) to get the files as artifacts. Pushing a tag such as v0.1.0 also publishes them.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, label: macos-arm64 }
          - { os: ubuntu-latest, label: linux-x64 }
          - { os: windows-latest, label: windows-x64 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; else v="dev-${GITHUB_SHA::7}"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: Build the engine
        run: cargo build --release --locked
        working-directory: engine
      - name: Package a self contained copy
        run: node scripts/package.js "dist/DitCopy-${VERSION}-${{ matrix.label }}" --version "${VERSION}"
      - name: Audit the packaged copy for build machine leftovers
        run: node scripts/audit-bundle.js "dist/DitCopy-${VERSION}-${{ matrix.label }}"
      - name: Smoke test the packaged copy
        run: |
          d="dist/DitCopy-${VERSION}-${{ matrix.label }}"
          if [ -x "$d/runtime/node" ]; then "$d/runtime/node" scripts/smoke.js "$d"; else "$d/runtime/node.exe" scripts/smoke.js "$d"; fi
      - name: Make the archive
        run: |
          cd dist
          name="DitCopy-${VERSION}-${{ matrix.label }}"
          if [ "${{ runner.os }}" = "Windows" ]; then 7z a -tzip "${name}.zip" "${name}" > /dev/null; else tar -czf "${name}.tar.gz" "${name}"; fi
          ls -la "${name}".*
      - uses: actions/upload-artifact@v4
        with:
          name: DitCopy-${{ matrix.label }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  publish:
    name: Publish a release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" files/* --repo "${GITHUB_REPOSITORY}" --title "DitCopy ${GITHUB_REF_NAME#v}" --generate-notes
